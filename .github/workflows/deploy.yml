name: Lint-Test-Deply
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run lint script
        run: npm run lint
      - name: Run test script
        run: npm run test
      - name: Run build script
        run: npm run build